name: Deploy to Beget via SFTP

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: beget-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npx gulp public

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to Beget
        shell: bash
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [[ ! "$SFTP_USERNAME" =~ ^[A-Za-z0-9_-]+$ || -z "$LFTP_PASSWORD" ]]; then
            echo "::error::Configure SFTP_USERNAME and SFTP_PASSWORD in GitHub Actions secrets."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          # Host key matches the key accepted in the working WinSCP session.
          printf '%s\n' 'pavels3f.beget.tech ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPrkFejvxDbHmDYcF4Jfp/Xjx+WnaYZJU8G5/WALKb3T' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          lftp --norc <<EOF
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 2
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=15"
          open --env-password --user "$SFTP_USERNAME" sftp://pavels3f.beget.tech:22
          cd football.pavelsolntsev.ru/public_html
          mirror --reverse --no-perms --verbose --exclude '(^|/)(\.git[^/]*|node_modules|\.DS_Store)(/|$)' --exclude '^api(/|$)' ./public/ .
          bye
          EOF


